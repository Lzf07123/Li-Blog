# 禁止占位域名：本地/未配置时使用相对 baseURL；
# 部署时由 scripts/build.py 通过 SITE_BASEURL 环境变量注入真实域名
baseURL = "/"
title = "Li&Blog"
theme = "blog-theme"
dataDir = "config"
defaultContentLanguage = "zh-cn"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 20

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
lineNos = false
lineNumbersInTable = false
noClasses = false
style = "friendly"

# 文章侧边目录：识别 Markdown 二级/三级标题（自动生成锚点）
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputs]
home = ["HTML", "LLMS", "Security", "Humans"]
page = ["HTML"]
section = ["HTML"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Security]
mediaType = "text/plain"
baseName = "security"
isPlainText = true
notAlternativeFormats = true

[outputFormats.Humans]
mediaType = "text/plain"
baseName = "humans"
isPlainText = true
notAlternativeFormats = true

[params]
themeKey = "liblog-theme"
rss_full = false  # RSS 输出全文（true）或摘要（false）
