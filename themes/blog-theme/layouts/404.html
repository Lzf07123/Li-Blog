{{ define "main" }}
{{ $strings := hugo.Data.strings }}
<div class="not-found">
  <h1 class="page-title">{{ $strings.common.not_found_title }}</h1>
  <p class="not-found-body">{{ $strings.common.not_found_body }}</p>
  <p>
    <a class="more-link" href="{{ .Site.Home.RelPermalink }}">{{ $strings.nav.home }}</a>
    <span class="meta-sep">·</span>
    <a class="more-link" href="{{ "projects/" | relURL }}">{{ $strings.nav.projects }}</a>
    <span class="meta-sep">·</span>
    <a class="more-link" href="{{ "about/" | relURL }}">{{ $strings.nav.about }}</a>
  </p>
</div>
{{ end }}
